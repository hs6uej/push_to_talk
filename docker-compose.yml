services:
  ptt:
    build: .
    image: ptt-web:latest
    container_name: ptt-web
    restart: unless-stopped
    ports:
      - "${PTT_BIND:-127.0.0.1}:${PTT_PORT:-8090}:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?ตั้งค่า JWT_SECRET ในไฟล์ .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ตั้งค่า ADMIN_PASSWORD ในไฟล์ .env}
      MAX_TALK_SECONDS: ${MAX_TALK_SECONDS:-60}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
    volumes:
      - ptt-data:/data

volumes:
  ptt-data:
